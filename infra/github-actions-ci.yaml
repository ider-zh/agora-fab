name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: agorafab
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: agorafab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agorafab -d agorafab_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agorafab:ci-only-disposable@127.0.0.1:5432/agorafab_test
      TEST_DATABASE_URL: postgresql://agorafab:ci-only-disposable@127.0.0.1:5432/agorafab_test
      SEED_MODE: fixture
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/init-env.mjs
      - run: docker compose up --build -d --wait
      - run: docker compose run --rm seed
      - run: node scripts/smoke.mjs
      - run: |
          scripts/backup-db.sh "$RUNNER_TEMP/agorafab-check.dump"
          scripts/rehearse-db-restore.sh "$RUNNER_TEMP/agorafab-check.dump"
      - if: always()
        run: docker compose down -v

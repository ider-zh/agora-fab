name: agorafab

x-database-env: &database-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?Run pnpm env:init}:${POSTGRES_PASSWORD:?Run pnpm env:init}@db:5432/${POSTGRES_DB:?Run pnpm env:init}

x-mcp-public-url: &mcp-public-url ${MCP_PUBLIC_URL:-${WEB_PUBLIC_ORIGIN:-http://${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3100}}/mcp}

services:
  db:
    image: postgres:17.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:init}
    ports:
      - '127.0.0.1:${DB_PORT:-54329}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: agorafab-migrate
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: migrate
    environment:
      <<: *database-env
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  seed:
    image: agorafab-migrate
    command: ['pnpm', 'db:seed']
    profiles: ['fixtures']
    environment:
      <<: *database-env
      NODE_ENV: development
      SEED_MODE: fixture
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://${POSTGRES_USER:?Run pnpm env:init}:${POSTGRES_PASSWORD:?Run pnpm env:init}@db:5432/${POSTGRES_DB:?Run pnpm env:init}}
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-0}
      GITHUB_ADMIN_IDS: ${GITHUB_ADMIN_IDS:-}
      MCP_PUBLIC_URL: *mcp-public-url
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      WRITE_RATE_PER_PRINCIPAL: ${WRITE_RATE_PER_PRINCIPAL:-60}
      WRITE_RATE_PER_CREDENTIAL: ${WRITE_RATE_PER_CREDENTIAL:-40}
      SEARCH_RATE_PER_PEER: ${SEARCH_RATE_PER_PEER:-120}
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
    environment:
      API_INTERNAL_URL: http://api:3001
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-http://${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3100}}
      MCP_PUBLIC_URL: *mcp-public-url
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ingress:
    image: traefik:v3.7.14
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/agorafab.yaml
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3100}:8080'
    volumes:
      - ./infra/ingress.yaml:/etc/traefik/agorafab.yaml:ro
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
